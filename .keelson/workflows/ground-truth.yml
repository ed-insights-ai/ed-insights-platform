name: ground-truth
description: |
  Use when: you need to know whether what Postgres holds actually matches what the source box score said — before building a season-long system on it, and after any parser, loader or scraper change.
  Triggers: "ground truth", "is the data true", "source fidelity", "does the DB match the HTML", "did the parser fix work", "re-parse check".
  Does: runs twelve deterministic read-only checks against the cached box-score HTML, the parquet archive and the live Postgres, then prints one report with a per-check verdict and the file:line that causes each failure. Covers both men's and women's programmes.
  NOT for: internal consistency (that is data-integrity.yml), repairing anything (this never writes), scraping, or anything that touches the network.

requiresProject: true
mutates_checkout: false
tags: [data, fidelity, source-of-truth, soccer]

# ─────────────────────────────────────────────────────────────────────────────
# data-integrity.yml asks "is the data self-consistent". This workflow asks the
# different, harder question: "is the data TRUE to its source". Ground truth
# here means the 2,140 cached box scores under packages/pipeline/data/raw_html
# and the independent second transcription that exists whenever two schools
# scraped the same fixture. Nothing here fetches. The athletics sites are small
# and a durable check must never hammer them.
#
# FAIL CLOSED. Every check in this file must alarm when it cannot run.
#
# Q() sends psql stderr to /dev/null, so a dead database, a dropped table, a
# permissions change or one timed-out query all arrive in the shell as an EMPTY
# STRING. `${X:-0}` then substitutes the BENIGN value and the verdict stays `ok`;
# where there is no default, `[ "" -gt 0 ]` is a test ERROR (exit 2) rather than
# false, so the unguarded `&& V=alarm` never fires and V keeps its initialised
# `ok`. Nine of the twelve checks here used to read `[ OK ]` against a database
# that did not exist, with `?` in every headline slot.
#
# The convention, taken from the cache-provenance check below: after the queries
# run, assert every captured variable is non-empty; if any is empty, print an
# explicit `CHECK DID NOT RUN` alarm naming the empty captures and exit 0. The
# failure headline is deliberately NOT the measurement headline with blanks in
# it — a reader must be able to tell "the query failed" from "the data is bad"
# at a glance. Past that guard the verdict tests use bare "$VAR", because the
# `${VAR:-0}` defaults are what made the check fail open in the first place.
#
# THAT CONVENTION IS ONLY HALF OF IT, and the missing half is the one that bit.
# Asserting non-empty works for a psql capture because a dead query yields the
# empty string. It is USELESS for a capture built from `find | wc -l`, from
# `grep -rl | wc -l`, from a python sum() over a glob, or from a shell counter
# initialised to 0 and incremented in a loop. None of those can ever produce an
# empty string. They produce `0` — the same `0` a healthy, genuinely-clean check
# reports. "The directory was missing, unreadable, or the cwd was wrong" and "I
# looked and everything is fine" render identically, in the same sentence, with
# the same verdict.
#
# THE RULE: a check must be able to distinguish "I measured zero" from "I did not
# measure". For a counter, that means guarding the SOURCE, not the value — does
# the directory exist, is it readable, did the glob match a file, did the command
# run — and then either withholding the number or refusing to print a verdict.
# `[ -d "$D" ]` is NOT such a guard: test -d succeeds on a chmod-000 directory
# and grep reads nothing out of it. Count the files first.
#
# Where a node has a database half and a filesystem half, split the verdict
# rather than gate the whole node on the fragile half: home-away-truth reports
# its 471 contradictory fixtures from Postgres and separately marks the StatCrew
# venue evidence as not run. Do not throw away a working measurement to guard a
# broken one.
#
# The accumulator is named NORUN, not data-integrity.yml's MISSING, because
# gender-fidelity captures a SQL result into $MISSING. One name across this file
# beats matching the sibling file exactly — do not "harmonise" it.
#
# `${!v}` is bash indirect expansion. Keelson spawns `bash -c <body>` (see the
# bash handler in @keelson/cli), and bash 3.2 on this machine supports it. Do
# not port these loops to sh.
#
# Conventions inherited from data-integrity.yml, all learned the hard way:
#   * every node prints exactly one JSON line on stdout
#   * a check that cannot run exits 0 with an alarm JSON, never non-zero: the
#     report node turns absent output into ALARM too, but an explicit headline
#     says WHICH capture came back empty and a bare exit code does not.
#   * NEVER name a bash variable GROUPS (readonly builtin array of the caller's
#     gids — assignment is silently ignored and $GROUPS expands to a gid, 20 on
#     macOS, which reads as a plausible count). Same for UID/PWD/SECONDS/RANDOM/
#     LINENO/PPID/HOSTNAME/REPLY.
#   * NEVER put a multi-line heredoc in a YAML block scalar — content landing at
#     column 1 terminates the scalar and silently unregisters the whole file.
#     Embedded python is either one line, or a `script:` node with runtime: uv.
#   * bash nodes read upstream output from KEELSON_NODE_<id>_OUTPUT, never from
#     $<id>.output substitution.
# ─────────────────────────────────────────────────────────────────────────────

nodes:
  # ── 1. Full re-derivation from cached source ────────────────────────────
  # The single command that answers "did this edit change what we would store?".
  # Re-parses every cached box score with the LIVE parser functions and diffs
  # the 7 game fields, both team-stat rows x 5 metrics, the player-row multiset
  # and the event multiset against Postgres. ~85s for all 2,140 games.
  # Set GROUND_TRUTH_SAMPLE=1 for a fast per-(school,season) smoke pass.
  #
  # FAIL-CLOSED NOTE — this node is the ONE exception to the exit-0-with-an-alarm
  # convention described at the top of this file, and it must stay that way. It
  # fails closed by LETTING EXCEPTIONS ESCAPE: psycopg2 raises on a dead database,
  # a dropped table, a permissions change or a statement timeout, nothing reaches
  # stdout, the node exits non-zero, and the report node turns absent output into
  # ALARM. Do NOT "harmonise" it by wrapping the psycopg2 work in try/except — an
  # except block that prints a verdict is exactly how this check would start
  # failing open. The three bail() paths already emit an explicit alarm for the
  # conditions that are not exceptions. Its safety lives in the report node, so do
  # not weaken the `if (!raw) ... verdict:'alarm'` branch there either.
  - id: reparse-fidelity
    runtime: uv
    timeout: 900000
    deps: [psycopg2-binary, pandas, numpy, beautifulsoup4, lxml]
    script: |
      import json, os, sys
      from collections import Counter
      from datetime import datetime
      from pathlib import Path
      import psycopg2

      def bail(msg, cause=""):
          print(json.dumps({"check": "reparse-fidelity", "verdict": "alarm",
                            "headline": msg, "cause": cause}))
          raise SystemExit(0)

      def find_root():
          cands = []
          if os.environ.get("KEELSON_PROJECT_DIR"):
              cands.append(Path(os.environ["KEELSON_PROJECT_DIR"]))
          here = Path.cwd().resolve()
          cands.append(here)
          cands.extend(here.parents)
          for c in cands:
              b = Path(c).resolve()
              if (b / "packages/pipeline/src/parser.py").exists():
                  return b
          return None

      ROOT = find_root()
      if ROOT is None:
          bail("could not locate packages/pipeline from cwd " + str(Path.cwd()))

      PIPE = ROOT / "packages" / "pipeline"
      sys.path.insert(0, str(PIPE))
      os.chdir(PIPE)

      try:
          from src.config import load_schools
          from src.parser import parse_game
          from src.sidearm_parser import parse_sidearm_game
      except Exception as exc:
          bail("parser import failed: %s: %s" % (type(exc).__name__, exc), str(PIPE))

      RAW = PIPE / "data" / "raw_html"
      SCH = {s.abbreviation.upper(): s for s in load_schools(PIPE / "config" / "schools.toml")}
      K = int(os.environ.get("GROUND_TRUTH_SAMPLE", "999"))
      DSN = os.environ.get("DATABASE_URL", "postgresql://lume@localhost:5432/ed_insights")

      conn = psycopg2.connect(DSN)
      cur = conn.cursor()
      cur.execute("""SELECT abbreviation, gender, game_id, season_year, source_url, date,
                            venue, attendance, home_team, away_team, home_score, away_score
                     FROM (SELECT s.abbreviation, s.gender, g.*,
                                  row_number() OVER (PARTITION BY g.school_id, g.season_year
                                                     ORDER BY md5(g.game_id::text)) rn
                           FROM games g JOIN schools s ON s.id = g.school_id) t
                     WHERE rn <= %s ORDER BY abbreviation, season_year, game_id""", (K,))
      sample = cur.fetchall()
      if not sample:
          bail("games table is empty — nothing to compare against source")
      ids = tuple(r[2] for r in sample)

      cur.execute("SELECT game_id, is_home, team, shots, shots_on_goal, goals, corners, saves "
                  "FROM team_game_stats WHERE game_id IN %s", (ids,))
      dbt = {}
      for gid, ih, tname, *metrics in cur.fetchall():
          dbt.setdefault(gid, {})[ih] = (tname, tuple(metrics))

      cur.execute("SELECT game_id, player_name, shots, shots_on_goal, goals, assists "
                  "FROM player_game_stats WHERE game_id IN %s", (ids,))
      dbp = {}
      for gid, *rest in cur.fetchall():
          dbp.setdefault(gid, []).append(tuple(str(x) for x in rest))

      cur.execute("SELECT game_id, event_type, clock, player FROM game_events WHERE game_id IN %s", (ids,))
      dbe = {}
      for gid, *rest in cur.fetchall():
          dbe.setdefault(gid, []).append(tuple(str(x) for x in rest))

      def norm_date(s):
          if s in (None, "", "Unknown"):
              return None
          for fmt in ("%m/%d/%Y", "%m/%d/%y", "%Y-%m-%d"):
              try:
                  return datetime.strptime(s.strip(), fmt).date()
              except ValueError:
                  pass
          return ("UNPARSEABLE", s)

      # '' and 'Unknown' are normalised because they mean the same absence on both
      # sides. The literal string 'NaN' is deliberately NOT normalised: it is a real
      # storage infidelity and must surface here as well as in nan-sentinel.
      def nz(v):
          if isinstance(v, str):
              v = v.strip()
              return None if v in ("", "Unknown", "nan", "None") else v
          return v

      GFIELDS = ["date", "venue", "attendance", "home_team", "away_team", "home_score", "away_score"]
      TFIELDS = ["shots", "shots_on_goal", "goals", "corners", "saves"]
      PKEYS = ("player_name", "shots", "shots_on_goal", "goals", "assists")

      fieldcount, errs, per_gender = Counter(), [], Counter()
      clean = 0
      reparsed = 0
      no_html = 0

      for (ab, gender, gid, season, url, d_date, d_venue, d_att,
           d_home, d_away, d_hs, d_as) in sample:
          cfg = SCH.get(ab.upper())
          if cfg is None:
              errs.append("%s NO_CONFIG" % ab)
              continue
          path = RAW / ab.lower() / str((gid % 1000000) // 100) / ("game_%02d.html" % (gid % 100))
          if not path.exists():
              no_html += 1
              errs.append("%s %s MISSING_HTML" % (ab, gid))
              continue
          try:
              html = path.read_text(encoding="utf-8", errors="replace")
              if cfg.scraper == "sidearm":
                  r = parse_sidearm_game(html, gid, url or "", season,
                                         school_abbrev=cfg.abbreviation, school_name=cfg.name)
              else:
                  r = parse_game(html, gid, url or "", season, school_name=cfg.name)
          except Exception as exc:
              errs.append("%s %s REPARSE_FAILED %s: %s" % (ab, gid, type(exc).__name__, str(exc)[:70]))
              continue

          reparsed += 1
          per_gender[gender] += 1
          diffs = []
          g = r["game"]
          derived = {"date": norm_date(g.date), "venue": nz(g.venue), "attendance": g.attendance,
                     "home_team": nz(g.home_team), "away_team": nz(g.away_team),
                     "home_score": g.home_score, "away_score": g.away_score}
          stored = {"date": d_date, "venue": nz(d_venue), "attendance": d_att,
                    "home_team": nz(d_home), "away_team": nz(d_away),
                    "home_score": d_hs, "away_score": d_as}
          for f in GFIELDS:
              if derived[f] != stored[f]:
                  diffs.append(f)

          # match team rows by is_home so a name swap shows as a name diff, not a misalignment
          pteam = {t.is_home: t for t in r["team_stats"]}
          steam = dbt.get(gid, {})
          for is_home in (True, False):
              side = "home" if is_home else "away"
              a, b = pteam.get(is_home), steam.get(is_home)
              if a is None or b is None:
                  diffs.append("tgs_%s_row" % side)
                  continue
              if nz(a.team) != nz(b[0]):
                  diffs.append("tgs_%s_team" % side)
              for i, f in enumerate(TFIELDS):
                  if getattr(a, f) != b[1][i]:
                      diffs.append("tgs_%s_%s" % (side, f))

          pp = Counter(tuple(str(getattr(p, k)) for k in PKEYS) for p in r["player_stats"])
          ps = Counter(dbp.get(gid, []))
          if pp != ps:
              diffs.append("player_rows(+%d/-%d)" % (sum((pp - ps).values()), sum((ps - pp).values())))

          ep = Counter((e.event_type, str(e.clock), str(e.player)) for e in r["events"])
          es = Counter(tuple(x) for x in dbe.get(gid, []))
          if ep != es:
              diffs.append("events(+%d/-%d)" % (sum((ep - es).values()), sum((es - ep).values())))

          if not diffs:
              clean += 1
          for x in diffs:
              fieldcount[x.split("(")[0]] += 1

      total = len(sample)
      top = ", ".join("%s=%d" % (k, v) for k, v in fieldcount.most_common(6)) or "none"
      verdict = "ok"
      if reparsed < total:
          verdict = "alarm"
      elif fieldcount:
          verdict = "warn"
      headline = ("%d/%d cached box scores re-parsed (men %d / women %d), %d exact, %d differ, "
                  "%d parse errors, %d missing HTML; disagreeing fields: %s"
                  % (reparsed, total, per_gender.get("men", 0), per_gender.get("women", 0),
                     clean, reparsed - clean, len(errs) - no_html, no_html, top))
      cause = ("; ".join(errs[:4]) if errs else
               "a non-empty field list means Postgres no longer equals what the current parsers derive from the cached source")
      print(json.dumps({"check": "reparse-fidelity", "verdict": verdict,
                        "headline": headline, "cause": cause}))

  # ── 2. Home / away is observed, not fabricated ──────────────────────────
  # Two truths, neither of which needs the network: (a) two schools' independent
  # scrapes of one fixture must agree on who was home; (b) the StatCrew header
  # states the venue in plain text, and Harding's home venue is Searcy, Ark.
  - id: home-away-truth
    timeout: 120000
    bash: |
      set -uo pipefail
      Q() { psql -U lume -d ed_insights -At -c "$1" 2>/dev/null; }
      PAIRSETS=$(Q "WITH p AS (SELECT g.game_id, g.school_id, s.gender, g.date, g.home_team,
                                      least(g.home_team,g.away_team) t1, greatest(g.home_team,g.away_team) t2
                               FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL)
                    SELECT count(*) FROM (SELECT date,gender,t1,t2 FROM p GROUP BY 1,2,3,4
                                          HAVING count(*)>1 AND count(DISTINCT school_id)>1) q")
      CONTRA=$(Q "WITH p AS (SELECT g.game_id, g.school_id, s.gender, g.date, g.home_team,
                                    least(g.home_team,g.away_team) t1, greatest(g.home_team,g.away_team) t2
                             FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL)
                  SELECT count(*) FROM (SELECT date,gender,t1,t2,count(DISTINCT home_team) nh FROM p
                                        GROUP BY 1,2,3,4 HAVING count(*)>1 AND count(DISTINCT school_id)>1) q
                  WHERE nh>1")
      SELFHOME=$(Q "SELECT coalesce(string_agg(ab||' '||selfh||'/'||n,', ' ORDER BY selfh DESC),'none')
                    FROM (SELECT s.abbreviation ab, count(*) n,
                                 count(*) FILTER (WHERE g.home_team ILIKE '%'||split_part(s.name,' ',1)||'%') selfh
                          FROM games g JOIN schools s ON s.id=g.school_id GROUP BY 1) t
                    WHERE selfh = n")
      R=packages/pipeline/data/raw_html
      # SOURCE-SIDE GUARD. WITHVENUE/ATHOME come from `grep -rl | wc -l`, which
      # can never return the empty string the psql guard below looks for: it
      # prints 0 for a missing, empty or unreadable directory exactly as loudly as
      # for a corpus that genuinely states no venue. `[ -d ]` does not save it —
      # test -d succeeds on a chmod-000 directory, grep then reads nothing, and
      # this node reports "a venue for 0 box scores of which 0 are away from
      # Searcy" as a measured fact. Count the files that WOULD be scanned before
      # trusting any count of what is inside them; zero scannable files is "did
      # not measure", and it is left EMPTY here so it cannot be printed as a
      # number. Do not re-initialise these to 0.
      # Both directories are required, not either: the database side of the
      # sentence counts HU+HUW together, so a source side that silently covered
      # only the men's cache would be compared against a denominator spanning
      # both. The old `[ -d hu ] || [ -d huw ]` made that undercount invisible.
      HUDIRS=; HUMISS=; SRCFILES=0
      for d in hu huw; do
        N=
        if [ -d "$R/$d" ] && [ -r "$R/$d" ] && [ -x "$R/$d" ]; then
          N=$(find "$R/$d" -type f -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
          [ $? -eq 0 ] || N=
        fi
        if [ -n "$N" ] && [ "$N" -gt 0 ]; then
          HUDIRS="$HUDIRS $R/$d"; SRCFILES=$(( SRCFILES + N ))
        else
          HUMISS="$HUMISS $d"
        fi
      done
      WITHVENUE=; ATHOME=; AWAYSRC=
      if [ -z "$HUMISS" ]; then
        # pipefail is set, so these carry grep's status: 1 is "no file matched"
        # (a real zero) and 2 is "grep could not read something" (not a zero).
        WITHVENUE=$(grep -rlE '\([0-9]{1,2}/[0-9]{1,2}/[0-9]{2,4} at [^)<]*\)' $HUDIRS 2>/dev/null | wc -l | tr -d ' ')
        [ $? -gt 1 ] && WITHVENUE=
        ATHOME=$(grep -rlE '\([0-9]{1,2}/[0-9]{1,2}/[0-9]{2,4} at Searcy' $HUDIRS 2>/dev/null | wc -l | tr -d ' ')
        [ $? -gt 1 ] && ATHOME=
      fi
      STORED=$(Q "SELECT count(*) FROM games g JOIN schools s ON s.id=g.school_id
                  WHERE s.abbreviation IN ('HU','HUW') AND g.home_team ILIKE '%Harding%'")
      HUTOTAL=$(Q "SELECT count(*) FROM games g JOIN schools s ON s.id=g.school_id WHERE s.abbreviation IN ('HU','HUW')")
      [ -n "$WITHVENUE" ] && [ -n "$ATHOME" ] && AWAYSRC=$(( WITHVENUE - ATHOME ))
      # The five psql captures arrive empty when their query fails. SELFHOME
      # coalesces to the literal 'none' on success, so empty means it failed.
      NORUN=
      for v in PAIRSETS CONTRA SELFHOME STORED HUTOTAL; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      if [ -n "$NORUN" ]; then
        printf '{"check":"home-away-truth","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error."}\n' "$NORUN"
        exit 0
      fi
      # Past the guard every capture is non-empty, so these tests now mean only
      # what they say. This node used to alarm on a dead database by COINCIDENCE:
      # STORED and HUTOTAL were both empty, `${X:-0}` made both 0, and `0 -eq 0`
      # is true. That is two failed queries agreeing with each other, not a
      # detection, and it evaporated the moment the HTML side read 0 as well.
      V=ok
      [ "$CONTRA" -gt 0 ] && V=alarm
      # SPLIT VERDICT. The database half above needs no HTML and its 471
      # contradictory fixtures are a real finding, so an unreadable cache must not
      # suppress it — but the source half must not be reported either, and least
      # of all as zero. Print the database numbers, name the source half as not
      # run, and alarm because half of this check did not happen.
      if [ -z "$WITHVENUE" ] || [ -z "$ATHOME" ]; then
        printf '{"check":"home-away-truth","verdict":"alarm","headline":"DATABASE HALF ONLY — %s of %s twice-scraped same-gender fixtures have both rows claiming home; %s of %s HU+HUW rows store Harding as home; always-self-home programmes: %s. SOURCE HALF DID NOT RUN — the StatCrew venue line was never counted (%s scannable .html files under %s; unusable programme directories:%s), so the venue and away-from-Searcy figures are withheld rather than reported as zero.","cause":"the cached HU/HUW box scores were missing, empty or unreadable, or this node ran from a cwd that is not the repository root — grep prints 0 for every one of those and it is indistinguishable from a source that states no venue. The database counts above stand on their own. Where the contradictory-fixture count is non-zero the mechanism is parser.py:859-862 swapping whenever the school name matches the away slot, and sidearm_parser.py:127-134 assigning score-table row 0 to home."}\n' \
          "$CONTRA" "$PAIRSETS" "$STORED" "$HUTOTAL" "$SELFHOME" "$SRCFILES" "$R" \
          "${HUMISS:- none — grep could not finish reading the corpus}"
        exit 0
      fi
      [ "$AWAYSRC" -gt 0 ] && [ "$STORED" -eq "$HUTOTAL" ] && V=alarm
      # SRCFILES IS THE DENOMINATOR, and until now it was printed only on the
      # failure path. The guards above reject a programme directory with nothing
      # scannable, but they pass on one holding a SINGLE readable file, and a
      # partial cache is the ordinary state of this tree — mid-scrape, just after
      # a school is added, or with one athletics site down. That is legitimate and
      # must NOT alarm; what must not happen is reporting "a venue for 2 box
      # scores, 0 away from Searcy" in the same sentence shape as a full corpus.
      # WITHVENUE, ATHOME and the AWAYSRC derived from them now all state what
      # they were measured over, so a thin corpus is self-evident in the headline.
      printf '{"check":"home-away-truth","verdict":"%s","headline":"%s of %s twice-scraped same-gender fixtures have both rows claiming home; StatCrew source states a venue for %s of %s cached HU+HUW box scores read, of which %s are away from Searcy, yet %s of %s HU+HUW rows store Harding as home; always-self-home programmes: %s","cause":"parser.py:859-862 swaps whenever the school name matches the away slot (StatCrew titles are Visitor vs Home, the reverse of the comment); sidearm_parser.py:127-134 assigns score-table row 0 to home and the corrective swap at :414-443 is gated on an is_home hint that sidearm_parser.py:369 derives from a vs/at regex that returns True for every SideArm page. Read the venue figures against the box-score denominator: they are a claim about the corpus that was actually read, not about every box score that should exist"}\n' \
        "$V" "$CONTRA" "$PAIRSETS" "$WITHVENUE" "$SRCFILES" "$AWAYSRC" "$STORED" "$HUTOTAL" "$SELFHOME"

  # ── 3. Independent corroboration ────────────────────────────────────────
  # The only check in the suite that tests whether the numbers are TRUE rather
  # than merely self-consistent: the same match transcribed by two unrelated
  # athletics websites. The join accepts either orientation so it keeps working
  # after the home/away bug above is fixed.
  - id: cross-source
    timeout: 120000
    bash: |
      set -uo pipefail
      Q() { psql -U lume -d ed_insights -At -c "$1" 2>/dev/null; }
      SQL="WITH pairs AS (
             SELECT a.game_id ga, b.game_id gb
             FROM games a JOIN schools sa ON sa.id=a.school_id
             JOIN games b ON b.date=a.date AND b.school_id<>a.school_id
               AND ((b.home_team=a.away_team AND b.away_team=a.home_team)
                 OR (b.home_team=a.home_team AND b.away_team=a.away_team))
             JOIN schools sb ON sb.id=b.school_id AND sb.gender=sa.gender
             WHERE a.date IS NOT NULL AND a.game_id<b.game_id)
           SELECT count(*)
                ||'|'||count(*) FILTER (WHERE x.shots=y.shots AND x.shots_on_goal=y.shots_on_goal
                                          AND x.goals=y.goals AND x.corners=y.corners AND x.saves=y.saves)
                ||'|'||count(*) FILTER (WHERE x.goals<>y.goals)
                ||'|'||count(*) FILTER (WHERE x.shots_on_goal<>y.shots_on_goal)
           FROM pairs p JOIN team_game_stats x ON x.game_id=p.ga
           JOIN team_game_stats y ON y.game_id=p.gb AND y.team=x.team"
      OUT=$(Q "$SQL")
      NROWS=$(printf '%s' "$OUT" | cut -d'|' -f1)
      ALL5=$(printf '%s' "$OUT" | cut -d'|' -f2)
      GDIFF=$(printf '%s' "$OUT" | cut -d'|' -f3)
      SOGDIFF=$(printf '%s' "$OUT" | cut -d'|' -f4)
      EVOUT=$(Q "WITH pairs AS (SELECT g1.game_id id1, g1.school_id s1, g2.game_id id2, g2.school_id s2
                                FROM games g1 JOIN games g2 ON g1.date=g2.date AND g1.school_id<g2.school_id
                                  AND ((g1.home_team=g2.home_team AND g1.away_team=g2.away_team)
                                    OR (g1.home_team=g2.away_team AND g1.away_team=g2.home_team))
                                JOIN schools c1 ON c1.id=g1.school_id JOIN schools c2 ON c2.id=g2.school_id
                                WHERE c1.gender=c2.gender AND g1.date IS NOT NULL),
                      a AS (SELECT p.id1,p.id2,e.event_type,e.clock FROM pairs p JOIN game_events e
                            ON e.game_id=p.id1 AND e.school_id=p.s1 WHERE e.event_type<>'substitution'),
                      b AS (SELECT p.id1,p.id2,e.event_type,e.clock FROM pairs p JOIN game_events e
                            ON e.game_id=p.id2 AND e.school_id=p.s2 WHERE e.event_type<>'substitution')
                 SELECT (SELECT count(*) FROM pairs)||'|'||(SELECT count(*) FROM a)
                        ||'|'||(SELECT count(*) FROM (SELECT * FROM a EXCEPT ALL SELECT * FROM b) x)")
      EVPAIRS=$(printf '%s' "$EVOUT" | cut -d'|' -f1)
      EVROWS=$(printf '%s' "$EVOUT" | cut -d'|' -f2)
      EVONLY=$(printf '%s' "$EVOUT" | cut -d'|' -f3)
      # Both psql calls return a single pipe-joined row, so `cut` of an empty
      # string leaves every derived field empty. Asserting the seven derived
      # fields rather than OUT/EVOUT also catches a short row, which is what a
      # changed column list would look like.
      NORUN=
      for v in NROWS ALL5 GDIFF SOGDIFF EVPAIRS EVROWS EVONLY; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      if [ -n "$NORUN" ]; then
        printf '{"check":"cross-source","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error."}\n' "$NORUN"
        exit 0
      fi
      V=ok
      [ "$GDIFF" -gt 0 ] && V=alarm
      { [ "$SOGDIFF" -gt 0 ] || [ "$EVONLY" -gt 0 ]; } && [ "$V" = ok ] && V=warn
      printf '{"check":"cross-source","verdict":"%s","headline":"%s team-sides transcribed twice from unrelated sites: %s agree on all five metrics, %s disagree on goals, %s on shots-on-goal; %s twice-scraped fixtures yield %s non-sub events of which %s appear on only one side","cause":"a goals disagreement means one transcription is simply wrong; shots-on-goal drift is parser.py:886-888 coercing an absent SOG column to 0 instead of NULL"}\n' \
        "$V" "$NROWS" "$ALL5" "$GDIFF" "$SOGDIFF" "$EVPAIRS" "$EVROWS" "$EVONLY"

  # ── 4. Roster attribution ───────────────────────────────────────────────
  # Whether a player row is attached to the right team. Detected purely from
  # internal arithmetic (player sums must equal that team's team_game_stats row,
  # not the opponent's) so it is cheap enough to gate every load.
  - id: roster-attribution
    timeout: 120000
    bash: |
      set -uo pipefail
      Q() { psql -U lume -d ed_insights -At -c "$1" 2>/dev/null; }
      OUT=$(Q "WITH p AS (SELECT game_id, team, sum(coalesce(shots,0)) sh, sum(coalesce(goals,0)) gl
                          FROM player_game_stats GROUP BY 1,2),
                    t AS (SELECT game_id, team, sum(coalesce(shots,0)) sh, sum(coalesce(goals,0)) gl
                          FROM team_game_stats GROUP BY 1,2),
                    pr AS (SELECT p.game_id, p.sh psh, p.gl pgl, t.sh tsh, t.gl tgl, o.sh osh, o.gl ogl
                           FROM p JOIN t ON t.game_id=p.game_id AND t.team=p.team
                           JOIN t o ON o.game_id=p.game_id AND o.team<>p.team)
               SELECT count(*) FILTER (WHERE NOT aligned AND swapped)
                    ||'|'||count(*) FILTER (WHERE aligned AND NOT swapped)
                    ||'|'||count(*) FILTER (WHERE NOT aligned AND NOT swapped)
                    ||'|'||count(*)
               FROM (SELECT game_id, bool_and(psh=tsh AND pgl=tgl) aligned,
                            bool_and(psh=osh AND pgl=ogl) swapped FROM pr GROUP BY 1) x")
      SWAPPED=$(printf '%s' "$OUT" | cut -d'|' -f1)
      ALIGNED=$(printf '%s' "$OUT" | cut -d'|' -f2)
      UNREC=$(printf '%s' "$OUT" | cut -d'|' -f3)
      NGAMES=$(printf '%s' "$OUT" | cut -d'|' -f4)
      SCRAPER=$(Q "SELECT count(*) FILTER (WHERE p.school_id=g.school_id)||'/'||count(*)
                   FROM player_game_stats p JOIN games g ON g.game_id=p.game_id")
      BOTHROSTERS=$(Q "SELECT count(*) FROM (SELECT game_id FROM player_game_stats
                       GROUP BY 1 HAVING count(DISTINCT school_id)=1 AND count(DISTINCT team)=2) z")
      OVERSIZE=$(Q "SELECT count(*) FROM (SELECT p.school_id, g.season_year FROM player_game_stats p
                    JOIN games g ON g.game_id=p.game_id GROUP BY 1,2
                    HAVING count(DISTINCT p.player_name) > 60) z")
      # The roster-swap count is quoted verbatim as a before/after acceptance
      # criterion elsewhere in the repair plan, so a silent `ok` here is directly
      # load-bearing. Assert all seven captures, not just the two that gate V.
      NORUN=
      for v in SWAPPED ALIGNED UNREC NGAMES SCRAPER BOTHROSTERS OVERSIZE; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      if [ -n "$NORUN" ]; then
        printf '{"check":"roster-attribution","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero, and the roster-swap count must not be quoted from a run that printed this.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error."}\n' "$NORUN"
        exit 0
      fi
      V=ok
      { [ "$SWAPPED" -gt 0 ] || [ "$BOTHROSTERS" -gt 0 ]; } && V=alarm
      printf '{"check":"roster-attribution","verdict":"%s","headline":"%s of %s games have the two rosters wearing each other name (%s aligned, %s unreconciled); school_id equals the SCRAPING school for %s player rows; %s games hold two teams under one school_id; %s school-seasons return more than 60 distinct players for a ~25-player roster","cause":"sidearm_parser.py:414-441 swaps home_team/away_team but :458-460 still labels player_stats[0] with home_team; player_game_stats has no player-team key at all, so storage.py stamps the scraper (stats.py:124, players.py:37/60/135, teams.py:305 then return both rosters)"}\n' \
        "$V" "$SWAPPED" "$NGAMES" "$ALIGNED" "$UNREC" "$SCRAPER" "$BOTHROSTERS" "$OVERSIZE"

  # ── 5. Card fidelity vs cached HTML ─────────────────────────────────────
  # The card type lives ONLY in a CSS class on an empty <td>, which pandas
  # renders as NaN. Count what the source says, per programme, and compare.
  - id: card-fidelity
    timeout: 300000
    bash: |
      set -uo pipefail
      R=packages/pipeline/data/raw_html
      if [ ! -d "$R" ]; then
        printf '{"check":"card-fidelity","verdict":"alarm","headline":"no cached HTML at %s — ground truth unavailable","cause":""}\n' "$R"
        exit 0
      fi
      # The path used to be a fixed /tmp/gt_cards_db.txt shared by every run on
      # the box, so two concurrent runs truncated each other's input mid-read and
      # each undercounted. $$ makes it private; the trap removes it on any exit.
      DBF=/tmp/gt_cards_db.$$.txt
      trap 'rm -f "$DBF"' EXIT
      psql -U lume -d ed_insights -At -F'|' -c "SELECT lower(s.abbreviation), s.gender, count(*) FILTER (WHERE e.event_type='red_card'), count(*) FILTER (WHERE e.event_type='yellow_card') FROM schools s LEFT JOIN game_events e ON e.school_id=s.id GROUP BY 1,2" 2>/dev/null > "$DBF"
      PSQLRC=$?
      # psql's exit status used to be discarded and the shell truncated the file
      # regardless, so a dead database meant an empty file, a loop body that never
      # executed, and BLIND=0 reading as a pass. Worse, the source-side grep lives
      # INSIDE the loop, so the check also reported zero red cards in the cached
      # HTML — a headline of confident zeroes on every side.
      if [ "$PSQLRC" -ne 0 ] || [ ! -s "$DBF" ]; then
        printf '{"check":"card-fidelity","verdict":"alarm","headline":"CHECK DID NOT RUN — the per-programme card query exited %s and produced no rows, so the comparison loop never executed. The cached HTML was never counted either: every number this check reports is produced inside that loop.","cause":"psql stderr is discarded here — database down, schools or game_events dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error."}\n' "$PSQLRC"
        exit 0
      fi
      SRCRED=0; DBRED=0; BLIND=0; BLINDLIST=""; MENRED=0; WOMENRED=0
      # NFILES is the DENOMINATOR, and it is not decoration. The guards below
      # refuse a programme with nothing scannable, but they pass on a programme
      # with ONE readable file, and a partial corpus is the normal state of this
      # cache: mid-scrape, just after adding a school, or with one athletics site
      # down. "cached source marks 0 red cards" and "0 red cards across 3 box
      # scores read" are the same verdict and obviously different statements, so
      # every source-side count in this node carries the number of files it was
      # actually measured over. Do NOT alarm on a partial corpus — make it visible.
      SEEN=0; NORUN=; NFILES=0
      while IFS='|' read -r SLUG GEN NRED NYEL; do
        [ -z "${SLUG:-}" ] && continue
        [ -d "$R/$SLUG" ] || continue
        # A short or non-numeric row would make `[ "$NRED" -eq 0 ]` a test error
        # (exit 2), which reads as false and silently drops the programme from
        # BLIND. Refuse to guess: an unusable row is a check that did not run.
        [ -n "${GEN:-}" ] || { NORUN="$NORUN $SLUG:gender"; continue; }
        case "${NRED:-}" in ''|*[!0-9]*) NORUN="$NORUN $SLUG:red_card"; continue ;; esac
        case "${NYEL:-}" in ''|*[!0-9]*) NORUN="$NORUN $SLUG:yellow_card"; continue ;; esac
        # SEEN alone is not enough. `[ -d ]` above succeeds on a chmod-000
        # directory and on an empty one, so a programme can be counted as SEEN
        # while grep reads nothing at all — HTMLRED comes back 0, it adds 0 to
        # SRCRED, and the programme silently drops out of BLIND. Thirteen such
        # directories render as "cached source marks 0 red cards, 0 programmes
        # show reds in their own HTML" with verdict ok, which is this check
        # reporting a clean bill of health for a corpus it never opened. Count the
        # files grep will be handed; a programme with nothing to scan is
        # unmeasured, not clean.
        NHTML=$(find "$R/$SLUG" -type f -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
        FRC=$?
        if [ "$FRC" -ne 0 ] || [ "${NHTML:-0}" -eq 0 ]; then NORUN="$NORUN $SLUG:no-readable-html"; continue; fi
        SEEN=$(( SEEN + 1 )); NFILES=$(( NFILES + NHTML ))
        # UNCHECKED EXIT STATUS — the third fail-open class, and the last one.
        # `grep ... | wc -l` throws grep's status away. grep exits 0 on match, 1 on
        # no match and 2 when it could not READ something: permission denied, an
        # I/O error, a path that vanished mid-walk. `wc -l` prints 0 for all three,
        # so a corpus that EXISTS and passes every guard above but cannot be read
        # arrived here as a confident "0 red cards" with verdict ok — a verifier
        # drove HTMLRED from 166 to 0 with the directories fully intact.
        # PIPESTATUS is invisible across a command substitution, so restructure
        # instead: capture the matches, check the producing command, then count the
        # capture separately. `-gt 1` is the boundary and it matters — exit 1 means
        # "no matches", which is a real and legitimate measurement of zero, and
        # treating it as failure would turn every clean programme into a false
        # alarm. Only exit 2 and above is a search that did not happen.
        REDHITS=$(grep -rho 'penalty-type red' "$R/$SLUG" 2>/dev/null); GRC=$?
        if [ "$GRC" -gt 1 ]; then NORUN="$NORUN $SLUG:red-grep-exit-$GRC"; continue; fi
        HTMLRED=$(printf '%s' "$REDHITS" | grep -c .)
        SRCRED=$(( SRCRED + HTMLRED ))
        DBRED=$(( DBRED + NRED ))
        [ "$GEN" = men ] && MENRED=$(( MENRED + HTMLRED ))
        [ "$GEN" = women ] && WOMENRED=$(( WOMENRED + HTMLRED ))
        if [ "$HTMLRED" -gt 0 ] && [ "$NRED" -eq 0 ]; then
          BLIND=$(( BLIND + 1 ))
          BLINDLIST="$BLINDLIST $SLUG/$GEN=$HTMLRED"
        fi
      done < "$DBF"
      [ "$SEEN" -eq 0 ] && NORUN="$NORUN no-programme-matched-a-cached-HTML-directory"
      if [ -n "$NORUN" ]; then
        printf '{"check":"card-fidelity","verdict":"alarm","headline":"CHECK DID NOT RUN — this check could not use:%s. Those are unusable rows, unreadable source directories or failed searches, not measurements of zero.","cause":"either a programme row came back short or non-numeric (the column list changed, or gender is NULL), or a programme directory under packages/pipeline/data/raw_html held no readable .html for grep to count, or grep exited 2 or above and so could not read files that are present (permission denied, an I/O error, a path that vanished), or no abbreviation in schools matched a directory there at all. A grep over an empty or unreadable directory reports 0 red cards exactly as it reports a clean one, so those programmes are withheld instead of summed."}\n' "$NORUN"
        exit 0
      fi
      V=ok; [ "$BLIND" -gt 0 ] && V=alarm
      printf '{"check":"card-fidelity","verdict":"%s","headline":"cached source marks %s red cards (men %s / women %s) across %s cached box scores read from %s programmes; the database stores %s; %s programmes show reds in their own HTML and zero in the DB:%s","cause":"sidearm_parser.py:339-348 hardcodes event_type=yellow_card for every caution row — the red marker is a CSS class on an empty td that pandas.read_html drops, shifting the row (see the column-shift note at sidearm_parser.py:320-328). Recoverable in place with re.findall on the penalty-type class; no re-scrape needed. Read the red-card count against the box-score denominator: a low count over a small denominator is an unfinished corpus, not a clean parser"}\n' \
        "$V" "$SRCRED" "$MENRED" "$WOMENRED" "$NFILES" "$SEEN" "$DBRED" "$BLIND" "${BLINDLIST:- none}"

  # ── 6. Substitution coverage vs cached HTML ─────────────────────────────
  # Substitutions are not a StatCrew-only feature of the SOURCE, only of our
  # parser: the SideArm play-by-play tables carry them and are never read.
  - id: substitution-coverage
    timeout: 300000
    bash: |
      set -uo pipefail
      R=packages/pipeline/data/raw_html
      if [ ! -d "$R" ]; then
        printf '{"check":"substitution-coverage","verdict":"alarm","headline":"no cached HTML at %s — ground truth unavailable","cause":""}\n' "$R"
        exit 0
      fi
      # Same fixed shared /tmp path as card-fidelity had, same fix. See the
      # comments there — the mechanism and the failure mode are identical.
      DBF=/tmp/gt_subs_db.$$.txt
      trap 'rm -f "$DBF"' EXIT
      psql -U lume -d ed_insights -At -F'|' -c "SELECT lower(s.abbreviation), s.gender, count(*) FILTER (WHERE e.event_type='substitution') FROM schools s LEFT JOIN game_events e ON e.school_id=s.id GROUP BY 1,2" 2>/dev/null > "$DBF"
      PSQLRC=$?
      if [ "$PSQLRC" -ne 0 ] || [ ! -s "$DBF" ]; then
        printf '{"check":"substitution-coverage","verdict":"alarm","headline":"CHECK DID NOT RUN — the per-programme substitution query exited %s and produced no rows, so the comparison loop never executed. The cached HTML was never counted either: every number this check reports is produced inside that loop.","cause":"psql stderr is discarded here — database down, schools or game_events dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error."}\n' "$PSQLRC"
        exit 0
      fi
      SRCSUB=0; DBSUB=0; BLIND=0; BLINDLIST=""; MENBLIND=0; WOMENBLIND=0
      # NFILES is the denominator — see the long note in card-fidelity. The guards
      # here pass on a programme with a single readable file, and a half-scraped
      # cache is normal rather than exotic, so the headline must say how much
      # source produced the number.
      SEEN=0; NORUN=; NFILES=0
      while IFS='|' read -r SLUG GEN NSUB; do
        [ -z "${SLUG:-}" ] && continue
        [ -d "$R/$SLUG" ] || continue
        [ -n "${GEN:-}" ] || { NORUN="$NORUN $SLUG:gender"; continue; }
        case "${NSUB:-}" in ''|*[!0-9]*) NORUN="$NORUN $SLUG:substitution"; continue ;; esac
        # Same source guard as card-fidelity, same reason — see the long comment
        # there. `[ -d ]` passing is not evidence that grep could read anything,
        # and 13 empty directories otherwise print "cached source mentions
        # substitution: 0 times ... 0 programmes have substitutions in their own
        # HTML and none stored" with verdict ok.
        NHTML=$(find "$R/$SLUG" -type f -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
        FRC=$?
        if [ "$FRC" -ne 0 ] || [ "${NHTML:-0}" -eq 0 ]; then NORUN="$NORUN $SLUG:no-readable-html"; continue; fi
        SEEN=$(( SEEN + 1 )); NFILES=$(( NFILES + NHTML ))
        # Same unchecked-exit-status fix as card-fidelity, same reason and same
        # boundary — see the long comment there. A verifier drove HTMLSUB from
        # 130,862 to 0 with every directory intact, because `| wc -l` discarded the
        # grep exit 2 that said it had not read anything. Exit 1 ("no matches")
        # must stay a legitimate zero; only exit 2 and above is a failed search.
        SUBHITS=$(grep -rho 'substitution:' "$R/$SLUG" 2>/dev/null); GRC=$?
        if [ "$GRC" -gt 1 ]; then NORUN="$NORUN $SLUG:sub-grep-exit-$GRC"; continue; fi
        HTMLSUB=$(printf '%s' "$SUBHITS" | grep -c .)
        SRCSUB=$(( SRCSUB + HTMLSUB ))
        DBSUB=$(( DBSUB + NSUB ))
        if [ "$HTMLSUB" -gt 0 ] && [ "$NSUB" -eq 0 ]; then
          BLIND=$(( BLIND + 1 ))
          BLINDLIST="$BLINDLIST $SLUG/$GEN"
          [ "$GEN" = men ] && MENBLIND=$(( MENBLIND + 1 ))
          [ "$GEN" = women ] && WOMENBLIND=$(( WOMENBLIND + 1 ))
        fi
      done < "$DBF"
      [ "$SEEN" -eq 0 ] && NORUN="$NORUN no-programme-matched-a-cached-HTML-directory"
      if [ -n "$NORUN" ]; then
        printf '{"check":"substitution-coverage","verdict":"alarm","headline":"CHECK DID NOT RUN — this check could not use:%s. Those are unusable rows, unreadable source directories or failed searches, not measurements of zero.","cause":"either a programme row came back short or non-numeric (the column list changed, or gender is NULL), or a programme directory under packages/pipeline/data/raw_html held no readable .html for grep to count, or grep exited 2 or above and so could not read files that are present (permission denied, an I/O error, a path that vanished), or no abbreviation in schools matched a directory there at all. A grep over an empty or unreadable directory reports 0 substitutions exactly as it reports a clean one, so those programmes are withheld instead of summed."}\n' "$NORUN"
        exit 0
      fi
      V=ok; [ "$BLIND" -gt 0 ] && V=alarm
      printf '{"check":"substitution-coverage","verdict":"%s","headline":"cached source mentions substitution: %s times across %s cached box scores read from %s programmes (SideArm renders each play-by-play row twice, so halve it); the database stores %s substitution events; %s programmes (%s men / %s women) have substitutions in their own HTML and none stored:%s","cause":"sidearm_parser.py:12 dismisses the play-by-play as not used for structured data — parse_sidearm_game builds events only from the scoring summary (:469) and the cautions table (:474). The same tables also carry correctly-typed cards and use the exact TEAM substitution: X for Y. wording parser.py:725-738 already handles. Read the mention count against the box-score denominator: a small count over a small denominator is an unfinished corpus, not a parser that is keeping up"}\n' \
        "$V" "$SRCSUB" "$NFILES" "$SEEN" "$DBSUB" "$BLIND" "$MENBLIND" "$WOMENBLIND" "${BLINDLIST:- none}"

  # ── 7. Goal completeness and attributability ────────────────────────────
  # The scoreline is an independent oracle for the event stream: every goal that
  # was actually scored must have a goal event, with a scorer and a resolvable team.
  - id: goal-completeness
    timeout: 120000
    bash: |
      set -uo pipefail
      Q() { psql -U lume -d ed_insights -At -c "$1" 2>/dev/null; }
      OUT=$(Q "SELECT (SELECT count(*) FROM games)||'|'||count(*)||'|'||coalesce(sum(scoreline-goals),0)
                     ||'|'||count(*) FILTER (WHERE goals>scoreline)
               FROM (SELECT coalesce(g.home_score,0)+coalesce(g.away_score,0) AS scoreline,
                            (SELECT count(*) FROM game_events e WHERE e.game_id=g.game_id
                             AND e.school_id=g.school_id AND e.event_type='goal') AS goals
                     FROM games g) t WHERE goals<>scoreline")
      NGAMES=$(printf '%s' "$OUT" | cut -d'|' -f1)
      MISMATCH=$(printf '%s' "$OUT" | cut -d'|' -f2)
      SHORTFALL=$(printf '%s' "$OUT" | cut -d'|' -f3)
      PHANTOM=$(printf '%s' "$OUT" | cut -d'|' -f4)
      ATTR=$(Q "SELECT (SELECT count(*) FROM game_events WHERE event_type='goal' AND btrim(coalesce(player,''))='')
                     ||'|'||(SELECT count(*) FROM game_events WHERE event_type='goal')
                     ||'|'||(SELECT count(*) FROM game_events e JOIN games g ON g.game_id=e.game_id
                             AND g.school_id=e.school_id WHERE e.team NOT IN (g.home_team,g.away_team))
                     ||'|'||(SELECT count(*) FROM game_events)")
      NOSCORER=$(printf '%s' "$ATTR" | cut -d'|' -f1)
      NGOALS=$(printf '%s' "$ATTR" | cut -d'|' -f2)
      NOTEAM=$(printf '%s' "$ATTR" | cut -d'|' -f3)
      NEVENTS=$(printf '%s' "$ATTR" | cut -d'|' -f4)
      BADCLOCK=$(Q "SELECT count(*) FILTER (WHERE clock !~ '^[0-9]{1,3}:[0-5][0-9]$')||' malformed / '
                         ||count(*) FILTER (WHERE split_part(clock,':',1)::int > 110)||' beyond double-OT' FROM game_events")
      BYGENDER=$(Q "SELECT coalesce(string_agg(gender||' '||n,', '),'none') FROM
                    (SELECT s.gender, count(*) n FROM games g JOIN schools s ON s.id=g.school_id
                     WHERE NOT EXISTS (SELECT 1 FROM game_events e WHERE e.game_id=g.game_id) GROUP BY 1) t")
      # Four separate psql calls, so one failing query (the BADCLOCK regex scan is
      # the likeliest to time out) used to leave real numbers standing next to a
      # blank. BADCLOCK does not gate the verdict, which is exactly why it has to
      # be asserted here: nothing else would notice it vanished. BYGENDER
      # coalesces to the literal 'none' on success, so empty means it failed.
      NORUN=
      for v in NGAMES MISMATCH SHORTFALL PHANTOM NOSCORER NGOALS NOTEAM NEVENTS BADCLOCK BYGENDER; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      if [ -n "$NORUN" ]; then
        printf '{"check":"goal-completeness","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error."}\n' "$NORUN"
        exit 0
      fi
      V=ok
      [ "$PHANTOM" -gt 0 ] && V=alarm
      { [ "$MISMATCH" -gt 0 ] || [ "$NOSCORER" -gt 0 ]; } && [ "$V" = ok ] && V=warn
      printf '{"check":"goal-completeness","verdict":"%s","headline":"%s of %s games disagree with their own scoreline (%s goals missing, %s invented); %s of %s goal events have no scorer; %s of %s events carry a team string matching neither side of their game; clocks malformed/over-110 %s; games with no events at all: %s","cause":"parser.py:115-118 refuses to classify a scoring-summary table holding fewer than two mm:ss values, so 1-0 StatCrew games lose their only goal; sidearm_parser.py:287 drops the scorer when the (N) season-count suffix is absent; parser.py:397-399 falls through to the raw abbreviation so game_events.team never joins to games"}\n' \
        "$V" "$MISMATCH" "$NGAMES" "$SHORTFALL" "$PHANTOM" "$NOSCORER" "$NGOALS" \
        "$NOTEAM" "$NEVENTS" "$BADCLOCK" "$BYGENDER"

  # ── 8. Physically impossible rows ───────────────────────────────────────
  # Facts about football that no source can contradict. A drift here means a
  # column moved in a source layout and the parser is reading the wrong one.
  - id: impossible-rows
    timeout: 60000
    bash: |
      set -uo pipefail
      Q() { psql -U lume -d ed_insights -At -c "$1" 2>/dev/null; }
      OUT=$(Q "SELECT count(*) FILTER (WHERE shots_on_goal>shots)
                    ||'|'||count(*) FILTER (WHERE goals>shots_on_goal)
                    ||'|'||count(*) FILTER (WHERE shots_on_goal=0 AND shots>0)
                    ||'|'||count(*) FILTER (WHERE shots=0 AND shots_on_goal=0 AND corners=0 AND saves=0)
                    ||'|'||count(*) FROM team_game_stats")
      SOGGT=$(printf '%s' "$OUT" | cut -d'|' -f1)
      GOALGT=$(printf '%s' "$OUT" | cut -d'|' -f2)
      SOGZERO=$(printf '%s' "$OUT" | cut -d'|' -f3)
      ALLZERO=$(printf '%s' "$OUT" | cut -d'|' -f4)
      NROWS=$(printf '%s' "$OUT" | cut -d'|' -f5)
      # A doubled space is the signature of an abbreviation that was never split
      # off. Do NOT widen this to a trailing all-caps token: Northwestern OSU and
      # Southwestern OSU are the real names those sites publish.
      MANGLED=$(Q "SELECT coalesce(string_agg(DISTINCT team,', '),'none') FROM team_game_stats WHERE team ~ '\s\s'")
      WORST=$(Q "SELECT coalesce(string_agg(x,', '),'none') FROM
                 (SELECT s.abbreviation||' '||s.gender||' '||g.season_year||'='||count(*) x
                  FROM team_game_stats t JOIN games g ON g.game_id=t.game_id
                  JOIN schools s ON s.id=g.school_id
                  WHERE t.shots_on_goal=0 AND t.shots>0 GROUP BY s.abbreviation,s.gender,g.season_year
                  ORDER BY count(*) DESC LIMIT 4) z")
      # MANGLED and WORST coalesce to the literal 'none' on success, so empty
      # means the query failed. NROWS is the denominator — "did we look at any
      # team rows at all" — and a zero denominator certifies nothing, so it is
      # treated as a did-not-run rather than as four clean zeroes.
      NORUN=
      for v in SOGGT GOALGT SOGZERO ALLZERO NROWS MANGLED WORST; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      [ -n "${NROWS:-}" ] && [ "$NROWS" -eq 0 ] 2>/dev/null && NORUN="$NORUN NROWS=0(no team rows examined)"
      if [ -n "$NORUN" ]; then
        printf '{"check":"impossible-rows","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing usable for:%s. Those are failed queries or an empty denominator, not measurements of zero.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error."}\n' "$NORUN"
        exit 0
      fi
      V=ok
      { [ "$SOGGT" -gt 0 ] || [ "$GOALGT" -gt 0 ]; } && V=alarm
      { [ "$SOGZERO" -gt 0 ] || [ "$ALLZERO" -gt 0 ]; } && [ "$V" = ok ] && V=warn
      printf '{"check":"impossible-rows","verdict":"%s","headline":"of %s team rows: %s have SOG above shots, %s have goals above SOG, %s claim zero SOG with shots taken (worst: %s), %s are entirely zero; mangled team names: %s","cause":"parser.py:886-888 coerces an absent shots_on_goal column to 0 rather than NULL, conflating absent with zero; sidearm_parser.py:120 rsplit on the last whitespace token mis-splits an abbreviation containing a period, so :507 team_stats_raw.get(abbrev) misses and every metric silently defaults to 0"}\n' \
        "$V" "$NROWS" "$SOGGT" "$GOALGT" "$SOGZERO" "$WORST" "$ALLZERO" "$MANGLED"

  # ── 9. NULL means NULL ──────────────────────────────────────────────────
  # A pandas np.nan reaching a varchar column through an unguarded row.get()
  # becomes the literal three-character text NaN, so IS NULL filters are no-ops.
  - id: nan-sentinel
    timeout: 60000
    bash: |
      set -uo pipefail
      Q() { psql -U lume -d ed_insights -At -c "$1" 2>/dev/null; }
      GAMESN=$(Q "SELECT 'venue='||count(*) FILTER (WHERE venue='NaN')
                       ||' home='||count(*) FILTER (WHERE home_team='NaN')
                       ||' away='||count(*) FILTER (WHERE away_team='NaN')
                       ||' url='||count(*) FILTER (WHERE source_url='NaN') FROM games")
      GAMESTOT=$(Q "SELECT count(*) FILTER (WHERE venue='NaN' OR home_team='NaN' OR away_team='NaN' OR source_url='NaN') FROM games")
      EVN=$(Q "SELECT 'assist1='||count(*) FILTER (WHERE assist1='NaN')
                    ||' assist2='||count(*) FILTER (WHERE assist2='NaN')
                    ||' description='||count(*) FILTER (WHERE description='NaN')
                    ||' team/player='||count(*) FILTER (WHERE team='NaN' OR player='NaN') FROM game_events")
      EVTOT=$(Q "SELECT count(*) FILTER (WHERE assist1='NaN' OR assist2='NaN' OR description='NaN' OR team='NaN' OR player='NaN') FROM game_events")
      STATN=$(Q "SELECT (SELECT count(*) FROM team_game_stats WHERE team='NaN')
                      ||'/'||(SELECT count(*) FROM player_game_stats WHERE team='NaN' OR player_name='NaN')")
      NULLDATE=$(Q "SELECT count(*) FROM games WHERE date IS NULL")
      DATEWHO=$(Q "SELECT coalesce(string_agg(x,', '),'none') FROM
                   (SELECT s.abbreviation||' '||s.gender||' '||g.season_year||'='||count(*) x
                    FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NULL
                    GROUP BY s.abbreviation, s.gender, g.season_year ORDER BY count(*) DESC LIMIT 8) z")
      # This node has no row-count denominator at all, so before the guard below
      # nothing in it could distinguish "no NaN sentinels anywhere" from "no query
      # ran". Six psql calls, all six asserted; DATEWHO coalesces to the literal
      # 'none' on success, so empty means the query failed.
      NORUN=
      for v in GAMESN GAMESTOT EVN EVTOT STATN NULLDATE DATEWHO; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      if [ -n "$NORUN" ]; then
        printf '{"check":"nan-sentinel","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero, and this check has no denominator that would have given the emptiness away.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error."}\n' "$NORUN"
        exit 0
      fi
      V=ok
      { [ "$GAMESTOT" -gt 0 ] || [ "$EVTOT" -gt 0 ] || [ "$NULLDATE" -gt 0 ]; } && V=alarm
      printf '{"check":"nan-sentinel","verdict":"%s","headline":"games %s; game_events %s; team/player team=NaN %s; %s games store no date at all despite the source carrying one (%s)","cause":"load_db.py:133 passes row.get(venue) unguarded (:131,:135,:136,:209 share the pattern) and psycopg2 adapts np.nan to NaN::float which Postgres coerces into the varchar; load_db.py:236-247 does the same for events. The NULL dates are parser.py:160, whose title regex demands MM/DD/YY and rejects Sep. 1, 2016 and 10/2/2018 — and parser.py:188 keys the venue fallback off the same pattern, which is why the NULL-date rows are the same rows as the NaN venues"}\n' \
        "$V" "$GAMESN" "$EVN" "$STATN" "$NULLDATE" "$DATEWHO"

  # ── 10. Cache provenance ────────────────────────────────────────────────
  # Faithful to the cached HTML is worthless if the cached HTML is the wrong
  # game. Three offline proofs: the store is a bijection, no season directory
  # links a different year, and no two seasons share byte-identical files.
  - id: cache-provenance
    timeout: 300000
    bash: |
      set -uo pipefail
      R=packages/pipeline/data/raw_html
      if [ ! -d "$R" ]; then
        printf '{"check":"cache-provenance","verdict":"alarm","headline":"no cached HTML at %s — nothing to establish provenance against","cause":""}\n' "$R"
        exit 0
      fi
      # One line deliberately: a multi-line heredoc here would break out of the
      # YAML block scalar at column 1 and silently unregister this workflow.
      PY='import subprocess,tomllib; from pathlib import Path; o2a={s["ordinal"]:s["abbreviation"] for s in tomllib.load(open("config/schools.toml","rb"))["schools"]}; db={int(g) for g in subprocess.run(["psql","-U","lume","-d","ed_insights","-At","-c","SELECT game_id FROM games"],capture_output=True,text=True).stdout.split()}; dbk={(o2a.get(g//1000000,"?"),(g%1000000)//100,g%100) for g in db}; ck={(p.parent.parent.name.upper(),int(p.parent.name),int(p.stem.split("_")[1])) for p in Path("data/raw_html").rglob("game_*.html")}; print("%d|%d|%d|%d"%(len(db),len(ck),len(dbk-ck),len(ck-dbk)))'
      BIJ=$( (cd packages/pipeline && uv run python -c "$PY") 2>/dev/null | tail -1 )
      DBN=$(printf '%s' "$BIJ" | cut -d'|' -f1)
      CACHEN=$(printf '%s' "$BIJ" | cut -d'|' -f2)
      NOSRC=$(printf '%s' "$BIJ" | cut -d'|' -f3)
      NOROW=$(printf '%s' "$BIJ" | cut -d'|' -f4)
      # NBAD and NDUP are COUNTERS, and a counter that was never incremented is
      # indistinguishable from a clean scan: both are 0. A season glob that
      # matched nothing, a game_01.html nobody could read, or a shasum that never
      # ran all render as "0 season directories link a different year" and "0
      # pair(s) share a byte-identical game_01" — the two sentences an operator
      # reads as proof the archive is sound. So count the INPUTS as well as the
      # hits: NSEASON is how many season directories were walked, NLINKED how many
      # actually yielded a /stats/YYYY/ link, SHAS the raw digest rows. All three
      # are asserted in the guard below.
      YEARBAD=""; NBAD=0; NSEASON=0; NLINKED=0; NG01=0; READFAIL=
      for D in "$R"/*/[0-9][0-9][0-9][0-9]; do
        [ -d "$D" ] || continue
        NSEASON=$(( NSEASON + 1 ))
        Y=${D##*/}
        F="$D/game_01.html"
        # UNCHECKED EXIT STATUS, with the one twist that makes this node different
        # from card-fidelity. The old pipeline `grep | sort -u | tr` reported
        # grep's status nowhere, so an unreadable game_01.html produced an empty
        # LINKS and fell straight into the benign '' arm below — a verifier drove
        # NBAD from 2 to 0 that way, with every directory in place.
        #
        # But a per-directory alarm would be WRONG here, because grep exits 2 for
        # "no such file" and for "permission denied" alike, and both of those are
        # ordinary: 2 of the 119 season directories legitimately hold no
        # game_01.html at all, and 20 more hold one that carries no /stats/YYYY/
        # link. Alarming on any of those would condemn a healthy archive. So the
        # absent file is filtered with `[ -f ]` FIRST and simply skipped; past that
        # test an exit of 2 or above means grep could not read a file that IS
        # there, which is a failed search and is collected in READFAIL. Exit 1
        # ("no matches") stays a legitimate zero and feeds the '' arm as before.
        # The honest answer to the partial case is the denominator below, not a
        # per-directory guard.
        [ -f "$F" ] || continue
        NG01=$(( NG01 + 1 ))
        LRAW=$(grep -ohE '/stats/[0-9]{4}/' "$F" 2>/dev/null); LRC=$?
        if [ "$LRC" -gt 1 ]; then READFAIL="$READFAIL ${D#"$R"/}(grep-exit-$LRC)"; continue; fi
        LINKS=$(printf '%s' "$LRAW" | sort -u | tr -d '\n')
        [ -n "$LINKS" ] && NLINKED=$(( NLINKED + 1 ))
        case "$LINKS" in
          *"/stats/$Y/"*|'') ;;
          *) NBAD=$(( NBAD + 1 )); YEARBAD="$YEARBAD ${D#"$R"/}->$LINKS" ;;
        esac
      done
      # shasum SKIPS what it cannot read: it warns on stderr (discarded here),
      # hashes the rest and exits 1. `[ -z "$SHAS" ]` therefore passes on a single
      # readable file, so an archive that is 99% unreadable still reported "0
      # pair(s) share a byte-identical game_01" — the sentence an operator reads as
      # proof the cache is sound. Take the digests on their own so the status is
      # visible, then check BOTH the status and the row count against NG01, the
      # number of game_01.html files the walk above proved are present. A partial
      # hash can no longer masquerade as a complete one.
      SHARAW=$( (cd "$R" && shasum */[0-9][0-9][0-9][0-9]/game_01.html 2>/dev/null) ); SHARC=$?
      NSHA=$(printf '%s' "$SHARAW" | grep -c .)
      SHAS=$(printf '%s' "$SHARAW" | sort)
      DUPES=$(printf '%s\n' "$SHAS" | awk '{c[$1]=c[$1]" "$2} END {for (h in c) {n=split(c[h],a," "); if (n>1) printf "%s;", c[h]}}')
      NDUP=$(printf '%s' "$DUPES" | tr -cd ';' | wc -c | tr -d ' ')
      PHANTOM=$(psql -U lume -d ed_insights -At -c "SELECT coalesce(string_agg(x,', '),'none') FROM (SELECT s.abbreviation||' '||s.gender||' '||g.season_year||' holds '||count(*)||' rows dated '||min(extract(year FROM g.date))::int AS x FROM games g JOIN schools s ON s.id=g.school_id WHERE g.date IS NOT NULL AND extract(year FROM g.date)::int NOT IN (g.season_year, g.season_year+1) GROUP BY s.abbreviation, s.gender, g.season_year) z" 2>/dev/null)
      # This node was already the house pattern via `${NOSRC:-1}` — defaults that
      # ALARM rather than reassure. Two residual holes are closed here.
      #
      # (1) PHANTOM is a separate psql whose failure yielded '' -> `${PHANTOM:-none}`
      #     -> 'none' -> no alarm. That clause was fail-open on its own; it merely
      #     could not be reached because a dead DB already tripped NOROW.
      # (2) The dead-DB alarm arrived via NOROW ("cached files never loaded") and
      #     therefore NAMED THE WRONG CAUSE. The psql inside $PY has its stderr
      #     swallowed by capture_output, so its failure looks like an empty games
      #     table: BIJ still parses, DBN is a real 0, and the operator is sent to
      #     look at the cache. DBN=0 is treated as "the database answered nothing".
      #
      # (3) YEARBAD and DUPES are legitimately empty when there is nothing to
      #     report, so they still stay out of the non-empty loop and keep their
      #     printf defaults — but the counters derived from them do NOT, because
      #     an unwalked directory and a clean directory both count 0. NSEASON,
      #     NLINKED and SHAS are the evidence that the walk happened at all.
      NORUN=
      for v in DBN CACHEN NOSRC NOROW PHANTOM; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      [ "${DBN:-0}" -eq 0 ] 2>/dev/null && NORUN="$NORUN DBN=0(database answered nothing)"
      [ "$NSEASON" -eq 0 ] && NORUN="$NORUN NSEASON=0(no season directory walked, so NBAD=0 counts nothing)"
      [ "$NSEASON" -gt 0 ] && [ "$NLINKED" -eq 0 ] && NORUN="$NORUN NLINKED=0(no game_01.html yielded a season link, so NBAD=0 counts nothing)"
      [ -n "$READFAIL" ] && NORUN="$NORUN unreadable-game_01:$READFAIL"
      [ -z "$SHAS" ] && NORUN="$NORUN SHAS=empty(shasum hashed no game_01.html, so NDUP=0 counts nothing)"
      [ "$SHARC" -ne 0 ] && NORUN="$NORUN shasum-exit-$SHARC(it skipped files it could not read, so NDUP counts an incomplete archive)"
      [ "$NSHA" -ne "$NG01" ] && NORUN="$NORUN shasum-hashed-$NSHA-of-$NG01-game_01-files"
      if [ -n "$NORUN" ]; then
        printf '{"check":"cache-provenance","verdict":"alarm","headline":"CHECK DID NOT RUN — the provenance probes returned nothing for:%s. Those are failed queries, unwalked directories or failed searches, not a verdict about the cache. Do NOT read this as cached files never loaded, and do NOT read a zero counter as a clean archive.","cause":"DBN/CACHEN/NOSRC/NOROW come from the one-line uv run python above, whose psql sub-call hides its stderr behind capture_output, and PHANTOM comes from a direct psql with stderr discarded. NSEASON/NLINKED/SHAS are filesystem probes: they come back empty when the cache directories are missing or unreadable, or when this node ran from a cwd that is not the repository root. unreadable-game_01 means grep exited 2 or above on a game_01.html that is present, and a shasum exit or a hashed-N-of-M mismatch means shasum silently skipped files — in both cases the archive was not fully read, so no clean verdict can be drawn from it. A season directory that simply holds no game_01.html is normal and is NOT reported here. Re-run the psql by hand against ed_insights, and re-run the python from packages/pipeline, to see the actual error."}\n' "$NORUN"
        exit 0
      fi
      V=ok
      { [ "$NOSRC" -gt 0 ] || [ "$NOROW" -gt 0 ] || [ "$NBAD" -gt 0 ] || [ "$NDUP" -gt 0 ]; } && V=alarm
      [ "$PHANTOM" != none ] && V=alarm
      # DENOMINATORS. The season walk is the known partial case: guarding each
      # directory individually would condemn the 22 that legitimately yield no
      # link, so coverage is made VISIBLE instead. NBAD only has meaning against
      # NLINKED, and NDUP only against NSHA — "0 season directories link a
      # different year" out of 97 linked and "out of 3" are the same words and
      # completely different claims.
      printf '{"check":"cache-provenance","verdict":"%s","headline":"%s stored games vs %s cached files (%s rows with no cached source, %s cached files never loaded); %s season directories link a different year:%s (of %s walked, %s hold a game_01.html and %s of those yielded a /stats/YYYY/ link); %s season-directory pair(s) share a byte-identical game_01, across %s game_01.html files hashed; phantom seasons: %s","cause":"sidearm_discovery.py followed a 302 from an unrecognised season slug (FHSU and OBU mens 2020 is slugged 2020-21) and fetcher.py:35-48 keys the cache on the REQUESTED year, so the archive itself is poisoned. The PR #14 year guard (sidearm_discovery.py:68-105) stops new ones but the stale rows AND the mislabelled cache files must both be deleted — re-parsing cannot fix this. Read the year and duplicate counts against the walked/linked/hashed denominators: a zero measured over a handful of directories is an unfinished cache, not a clean one"}\n' \
        "$V" "$DBN" "$CACHEN" "$NOSRC" "$NOROW" "$NBAD" "${YEARBAD:- none}" \
        "$NSEASON" "$NG01" "$NLINKED" "$NDUP" "$NSHA" "$PHANTOM"

  # ── 11. Exported artifact vs source of record ───────────────────────────
  # data-integrity.yml sums data/structured/*/all/ and never opens the merged
  # export. That is where the 712 rows from a dead ordinal scheme are hiding.
  - id: export-staleness
    timeout: 300000
    bash: |
      set -uo pipefail
      Q() { psql -U lume -d ed_insights -At -c "$1" 2>/dev/null; }
      DBGAMES=$(Q "SELECT count(*) FROM games")
      DBEVENTS=$(Q "SELECT count(*) FROM game_events")
      DBPLAYERS=$(Q "SELECT count(*) FROM player_game_stats")
      # Fields 7/8/9 are the number of parquet FILES each glob matched. They exist
      # only to guard fields 4/5/6: `sum(...)` over an empty glob is 0, and a
      # missing export therefore claims "per-season parquet 0 games / 0 players /
      # 0 events" in the same breath and the same font as a real count. Same for
      # len(F): with no merged export on disk, max([]+[0]) makes EXPROWS and STALE
      # both 0, and STALE is the 712-row stale-ordinal finding this whole check
      # exists to produce. Fields 1-6 are byte-identical to before.
      PY='import glob,os,tomllib,pandas as pd; ok={s["ordinal"] for s in tomllib.load(open("config/schools.toml","rb"))["schools"]}; F=[f for f in ("data/structured/all/games.parquet","data/games.parquet") if os.path.exists(f)]; D=[pd.read_parquet(f,columns=["game_id"]) for f in F]; GE=sorted(glob.glob("data/structured/*/[0-9]*/events.parquet")); GG=sorted(glob.glob("data/structured/*/[0-9]*/games.parquet")); GP=sorted(glob.glob("data/structured/*/[0-9]*/player_stats.parquet")); ev=sum(len(pd.read_parquet(p,columns=["game_id"])) for p in GE); gm=sum(len(pd.read_parquet(p,columns=["game_id"])) for p in GG); pl=sum(len(pd.read_parquet(p,columns=["game_id"])) for p in GP); print("%d|%d|%d|%d|%d|%d|%d|%d|%d"%(len(F),max([len(d) for d in D]+[0]),max([int((~d.game_id.floordiv(1000000).isin(ok)).sum()) for d in D]+[0]),gm,ev,pl,len(GG),len(GE),len(GP)))'
      OUT=$( (cd packages/pipeline && uv run python -c "$PY") 2>/dev/null | tail -1 )
      NFILES=$(printf '%s' "$OUT" | cut -d'|' -f1)
      EXPROWS=$(printf '%s' "$OUT" | cut -d'|' -f2)
      STALE=$(printf '%s' "$OUT" | cut -d'|' -f3)
      PQGAMES=$(printf '%s' "$OUT" | cut -d'|' -f4)
      PQEVENTS=$(printf '%s' "$OUT" | cut -d'|' -f5)
      PQPLAYERS=$(printf '%s' "$OUT" | cut -d'|' -f6)
      NPQGAMES=$(printf '%s' "$OUT" | cut -d'|' -f7)
      NPQEVENTS=$(printf '%s' "$OUT" | cut -d'|' -f8)
      NPQPLAYERS=$(printf '%s' "$OUT" | cut -d'|' -f9)
      # Two independent sources here: three psql counts and one uv run python over
      # the parquet. Either side can fail alone, and each partial failure used to
      # MANUFACTURE a number rather than withhold one — a dead DB with readable
      # parquet reported "22782 events lost at merge", which is PQEVENTS minus an
      # empty string. Both sides are asserted before any arithmetic happens, so
      # EVLOST is computed only from two numbers that actually exist.
      #
      # Non-empty is necessary but NOT sufficient on the parquet side: every field
      # the python prints is a count, and a count of an absent artifact is a
      # confident 0, never a blank. NFILES=0 sailed straight through the loop
      # below and took EXPROWS and the load-bearing STALE=712 down to 0 with it,
      # which reads as a merged export that is clean rather than one that is not
      # there. Assert that each probe actually opened a file.
      NORUN=
      for v in DBGAMES DBEVENTS DBPLAYERS NFILES EXPROWS STALE PQGAMES PQEVENTS PQPLAYERS NPQGAMES NPQEVENTS NPQPLAYERS; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      [ "${NFILES:-0}" -eq 0 ] 2>/dev/null && NORUN="$NORUN NFILES=0(no merged export on disk, so the stale-ordinal count measured nothing)"
      [ "${NPQGAMES:-0}" -eq 0 ] 2>/dev/null && NORUN="$NORUN per-season-games.parquet-glob-matched-no-files"
      [ "${NPQEVENTS:-0}" -eq 0 ] 2>/dev/null && NORUN="$NORUN per-season-events.parquet-glob-matched-no-files"
      [ "${NPQPLAYERS:-0}" -eq 0 ] 2>/dev/null && NORUN="$NORUN per-season-player_stats.parquet-glob-matched-no-files"
      if [ -n "$NORUN" ]; then
        printf '{"check":"export-staleness","verdict":"alarm","headline":"CHECK DID NOT RUN — no usable value came back for:%s. Those are failed or empty probes, not measurements, and no export-drift number below would have been a comparison of two real counts.","cause":"DBGAMES/DBEVENTS/DBPLAYERS come from Q() with psql stderr discarded; NFILES/EXPROWS/STALE/PQGAMES/PQEVENTS/PQPLAYERS come from the one-line uv run python above with its stderr discarded, which also fails when the cwd holds no packages/pipeline. A glob that matched no parquet sums to 0 rather than to nothing, so an absent export would otherwise have been reported as an export holding zero rows. Re-run each by hand to see the error."}\n' "$NORUN"
        exit 0
      fi
      EVLOST=$(( PQEVENTS - DBEVENTS ))
      V=ok
      [ "$STALE" -gt 0 ] && V=alarm
      { [ "$EVLOST" -ne 0 ] || [ "$PQGAMES" -ne "$DBGAMES" ] || [ "$PQPLAYERS" -ne "$DBPLAYERS" ]; } && [ "$V" = ok ] && V=warn
      printf '{"check":"export-staleness","verdict":"%s","headline":"%s merged export(s) hold %s games of which %s carry an ordinal absent from schools.toml; per-season parquet %s games / %s players / %s events vs db %s / %s / %s (%s events lost at merge)","cause":"storage.py:112-140 merge_all_schools concatenates whatever is on disk and never prunes a retired ordinal, then export.py:36 copies the result to data/; the event shortfall is storage.py:15-27 _build_event_id hashing seven fields but not description, so two real events sharing a clock collapse at storage.py:106/:138"}\n' \
        "$V" "$NFILES" "$EXPROWS" "$STALE" "$PQGAMES" "$PQPLAYERS" "$PQEVENTS" \
        "$DBGAMES" "$DBPLAYERS" "$DBEVENTS" "$EVLOST"

  # ── 12. Both programmes, side by side ───────────────────────────────────
  # Every defect above must be reported per gender, because the season-long
  # system is being built for the men's AND the women's programme. A gender that
  # looks cleaner is usually less well collected, not better transcribed.
  - id: gender-fidelity
    timeout: 120000
    bash: |
      set -uo pipefail
      Q() { psql -U lume -d ed_insights -At -c "$1" 2>/dev/null; }
      ROWS=$(Q "WITH p AS (SELECT game_id, team, sum(coalesce(shots,0)) sh, sum(coalesce(goals,0)) gl
                           FROM player_game_stats GROUP BY 1,2),
                     t AS (SELECT game_id, team, sum(coalesce(shots,0)) sh, sum(coalesce(goals,0)) gl
                           FROM team_game_stats GROUP BY 1,2),
                     pr AS (SELECT p.game_id, p.sh psh, p.gl pgl, t.sh tsh, t.gl tgl, o.sh osh, o.gl ogl
                            FROM p JOIN t ON t.game_id=p.game_id AND t.team=p.team
                            JOIN t o ON o.game_id=p.game_id AND o.team<>p.team),
                     sw AS (SELECT game_id, bool_and(psh=osh AND pgl=ogl) AND NOT bool_and(psh=tsh AND pgl=tgl) bad
                            FROM pr GROUP BY 1)
                SELECT string_agg(line,' | ' ORDER BY line) FROM (
                  SELECT s.gender||': '||count(DISTINCT s.abbreviation)||' programmes, '||count(*)||' games, '
                         ||count(*) FILTER (WHERE sw.bad)||' roster-swapped, '
                         ||count(*) FILTER (WHERE g.date IS NULL)||' dateless, '
                         ||count(*) FILTER (WHERE NOT EXISTS (SELECT 1 FROM game_events e WHERE e.game_id=g.game_id))
                         ||' event-less, '||round(avg((SELECT count(*) FROM game_events e WHERE e.game_id=g.game_id)),1)
                         ||' events/game' AS line
                  FROM games g JOIN schools s ON s.id=g.school_id
                  LEFT JOIN sw ON sw.game_id=g.game_id GROUP BY s.gender) z")
      NGEN=$(Q "SELECT count(DISTINCT gender) FROM schools s JOIN games g ON g.school_id=s.id")
      MISSING=$(Q "SELECT coalesce(string_agg(s.abbreviation||' '||s.gender,', '),'none') FROM schools s
                   WHERE s.enabled AND NOT EXISTS (SELECT 1 FROM games g WHERE g.school_id=s.id)")
      # A gender is only clean if BOTH are clean — this node is the parity gate,
      # so any defect landing on either programme must colour it.
      DEFECTS=$(Q "SELECT count(*) FROM games g WHERE g.date IS NULL
                     OR NOT EXISTS (SELECT 1 FROM game_events e WHERE e.game_id=g.game_id)")
      # This node used to be fail-closed BY ACCIDENT and only for a total outage:
      # NGEN empty -> `${NGEN:-0}` -> 0, and `[ 0 -lt 2 ]` happens to be true. That
      # is the threshold pointing the right way by luck, not a design. It was still
      # fail-OPEN for a single failed query — ROWS is the heaviest statement in the
      # file (three CTEs plus two correlated subqueries per game) and if it alone
      # timed out while NGEN succeeded, the verdict was a clean `ok` printed beside
      # the headline 'no rows'. All four captures are asserted now.
      #
      # The accumulator is NORUN, not MISSING: $MISSING is a SQL capture here.
      NORUN=
      for v in ROWS NGEN MISSING DEFECTS; do [ -n "${!v:-}" ] || NORUN="$NORUN $v"; done
      if [ -n "$NORUN" ]; then
        printf '{"check":"gender-fidelity","verdict":"alarm","headline":"CHECK DID NOT RUN — psql returned nothing for:%s. Those are failed queries, not measurements of zero. ROWS is the heaviest statement in this workflow and is the one that times out first.","cause":"Q() discards psql stderr, so the reason is not captured here — database down, table dropped, permissions changed, or the query timed out. Re-run it by hand against ed_insights to see the error. Note ROWS has no coalesce, so it is also empty when games is genuinely empty; that is still a condition this parity gate must refuse to certify."}\n' "$NORUN"
        exit 0
      fi
      V=ok
      [ "$NGEN" -lt 2 ] && V=alarm
      { [ "$MISSING" != none ] || [ "$DEFECTS" -gt 0 ]; } && [ "$V" = ok ] && V=warn
      printf '{"check":"gender-fidelity","verdict":"%s","headline":"%s; enabled programmes with no games at all: %s","cause":"the women programmes are not a smaller copy of the men — every parser defect above lands on both, and a lower events/game figure is the SideArm play-by-play blindness plus the discipline gap, not a quieter league"}\n' \
        "$V" "$ROWS" "$MISSING"

  # ── Report ──────────────────────────────────────────────────────────────
  - id: report
    runtime: bun
    always_run: true
    trigger_rule: all_done
    depends_on:
      [reparse-fidelity, home-away-truth, cross-source, roster-attribution,
       card-fidelity, substitution-coverage, goal-completeness, impossible-rows,
       nan-sentinel, cache-provenance, export-staleness, gender-fidelity]
    script: |
      const IDS = ['reparse_fidelity','home_away_truth','cross_source','roster_attribution',
                   'card_fidelity','substitution_coverage','goal_completeness','impossible_rows',
                   'nan_sentinel','cache_provenance','export_staleness','gender_fidelity']
      const MARK = { ok: '[ OK   ]', warn: '[ WARN ]', alarm: '[ ALARM]' }
      const rows = []
      for (const id of IDS) {
        const raw = (process.env[`KEELSON_NODE_${id}_OUTPUT`] || '').trim()
        if (!raw) { rows.push({ check: id, verdict: 'alarm', headline: 'check did not run', cause: '' }); continue }
        try {
          rows.push(JSON.parse(raw.split('\n').filter(l => l.trim().startsWith('{')).pop()))
        } catch {
          rows.push({ check: id, verdict: 'alarm', headline: `unparseable output: ${raw.slice(0, 160)}`, cause: '' })
        }
      }
      const n = v => rows.filter(r => r.verdict === v).length
      const worst = n('alarm') ? 'ALARM' : n('warn') ? 'WARN' : 'CLEAR'

      console.log('')
      console.log('  ED INSIGHTS — GROUND TRUTH (is the data FAITHFUL TO SOURCE)')
      console.log('  ' + '─'.repeat(72))
      console.log(`  ${worst}   ${n('ok')} clear · ${n('warn')} warn · ${n('alarm')} alarm   (${rows.length} checks)`)
      console.log('  ' + '─'.repeat(72))
      console.log('')
      for (const r of rows) {
        console.log(`  ${MARK[r.verdict] || '[  ?   ]'}  ${String(r.check).toUpperCase().replace(/_/g, '-')}`)
        console.log(`            ${r.headline}`)
        if (r.cause && r.verdict !== 'ok') console.log(`            └ ${r.cause}`)
        console.log('')
      }
      console.log('  ' + '─'.repeat(72))
      console.log('  Ground truth = the 2,140 cached box scores + the second independent')
      console.log('  transcription that exists wherever two schools scraped one fixture.')
      console.log('  Read-only, offline. Self-consistency is data-integrity.yml, not this.')
      console.log('  Set GROUND_TRUTH_SAMPLE=1 for a fast per-(school,season) re-parse pass.')
      console.log('')
      console.log(JSON.stringify({ verdict: worst, clear: n('ok'), warn: n('warn'), alarm: n('alarm'), checks: rows }))
